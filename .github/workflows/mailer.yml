name: Auto Mailer Campaign

on:
  schedule:
    # Run every 4 hours (0:00, 4:00, 8:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub website

permissions:
  contents: write # Allows GitHub to commit the progress

jobs:
  run-mailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install nodemailer dotenv

      - name: Run Mailer Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node auto-mailer.mjs

      - name: Commit and Push Progress
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/bulk_campaign/_SENT/ || true
          git commit -m "chore: save mailer progress [skip ci]" || echo "No new emails sent"
          git push
